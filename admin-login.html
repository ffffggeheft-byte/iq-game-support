<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التحكم | Hussain Salman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 flex items-center justify-center h-screen font-sans text-slate-200">

    <div class="bg-slate-900 p-8 rounded-xl border border-slate-800 w-full max-w-md shadow-2xl shadow-cyan-900/20">
        <div class="text-center mb-8">
            <i class="fa-solid fa-shield-halved text-4xl text-cyan-500 mb-3"></i>
            <h2 class="text-2xl font-bold text-white">تسجيل الدخول - الإدارة</h2>
        </div>
        
        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-slate-400 mb-1 text-sm">البريد الإلكتروني</label>
                <input type="email" id="email" class="w-full bg-slate-950 text-white border border-slate-800 rounded-lg p-3 focus:outline-none focus:border-cyan-500" required>
            </div>
            <div>
                <label class="block text-slate-400 mb-1 text-sm">كلمة المرور</label>
                <input type="password" id="password" class="w-full bg-slate-950 text-white border border-slate-800 rounded-lg p-3 focus:outline-none focus:border-cyan-500" required>
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg transition mt-4">تسجيل الدخول <i class="fa-solid fa-arrow-left ml-2"></i></button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRzFck1Z5peOL7pYpuG7hUeyZUoycgCEU",
            authDomain: "hussein-salman.firebaseapp.com",
            projectId: "hussein-salman",
            storageBucket: "hussein-salman.firebasestorage.app",
            messagingSenderId: "862323992221",
            appId: "1:862323992221:web:009cfd696d6f4142e91674",
            measurementId: "G-GSVSR1HBKR"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.textContent = "جاري التحقق...";
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    window.location.href = 'admin-dashboard.html';
                })
                .catch((error) => {
                    alert('خطأ في بيانات الدخول، تأكد من الإيميل والباسورد.');
                    btn.textContent = "تسجيل الدخول";
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
