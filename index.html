<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فراغ| علوم أمن سيبراني ومطور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .post-card { display: flex; }
        .hidden-card { display: none !important; }
        /* تنسيق قسم الشهادات */
        .cert-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- الهيدر والتعريف الشامل -->
    <header class="border-b border-slate-800 bg-slate-900/50 relative z-10">
        <div class="container mx-auto px-4 py-16 text-center max-w-4xl">
            <img src="https://ui-avatars.com/api/?name=Hussain+Salman&background=0D8B93&color=fff&size=120" alt="حسين سلمان" class="mx-auto rounded-full mb-4 border-4 border-cyan-800 shadow-[0_0_20px_rgba(13,139,147,0.3)]">
            <h1 class="text-4xl font-extrabold text-white mb-2">حسين سلمان</h1>
            <p class="text-cyan-400 font-medium mb-4"><i class="fa-solid fa-shield-halved ml-1"></i> طالب أمن سيبراني - الجامعة التكنولوجية</p>
            <p class="text-slate-400 text-sm leading-relaxed mb-6">مطور تطبيقات (Flutter / Godot) وباحث في مجال أمن المعلومات والبرمجيات.</p>
            
            <!-- حاوية الحسابات الشخصية الشاملة -->
            <div id="social-links-container" class="flex flex-wrap justify-center gap-3 mb-8">
                <!-- سيتم حقن الأزرار هنا من Firebase -->
            </div>
            
            <!-- شريط البحث السريع -->
            <div class="max-w-md mx-auto relative">
                <i class="fa-solid fa-search absolute right-4 top-3.5 text-slate-500"></i>
                <input type="text" id="searchInput" placeholder="ابحث في التطبيقات، الفيديوهات، والمقالات..." class="w-full bg-slate-900 border border-slate-700 rounded-full py-3 pr-11 pl-4 text-white focus:outline-none focus:border-cyan-500 transition shadow-inner">
            </div>
        </div>
    </header>

    <!-- القسم الجديد: الشهادات والإنجازات (سيتم إخفاؤه إذا لم توجد شهادات) -->
    <section id="certs-section" class="bg-slate-900/30 border-b border-slate-800 py-10 hidden">
        <div class="container mx-auto px-4 max-w-7xl">
            <h2 class="text-2xl font-bold mb-6 border-r-4 border-yellow-500 pr-3 text-yellow-400">الشهادات المعتمدة والإنجازات</h2>
            <div id="certs-container" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- سيتم حقن الشهادات هنا -->
            </div>
        </div>
    </section>

    <!-- أزرار الفلترة الذكية للمحتوى -->
    <div class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-4 flex justify-center gap-2 py-3 overflow-x-auto">
            <button class="filter-btn active bg-cyan-700 text-white px-4 py-1.5 rounded-full text-sm font-bold transition" data-filter="all">الكل</button>
            <button class="filter-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-4 py-1.5 rounded-full text-sm font-bold transition" data-filter="app"><i class="fa-brands fa-android ml-1"></i> تطبيقاتي</button>
            <button class="filter-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-4 py-1.5 rounded-full text-sm font-bold transition" data-filter="video"><i class="fa-brands fa-youtube ml-1"></i> فيديوهات</button>
            <button class="filter-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-4 py-1.5 rounded-full text-sm font-bold transition" data-filter="article"><i class="fa-solid fa-file-code ml-1"></i> مقالات</button>
        </div>
    </div>

    <!-- شبكة المحتوى (التطبيقات والمقالات) -->
    <main class="flex-grow py-10 container mx-auto px-4 max-w-7xl relative z-0">
        <div id="posts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="col-span-full text-center text-slate-500 py-10"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i><br>تحميل النظام...</div>
        </div>
    </main>

    <footer class="bg-slate-950 border-t border-slate-900 text-center py-6 text-slate-600 text-sm mt-auto">
        <p>&copy; 2026 حسين سلمان (UOT). جميع الحقوق محفوظة.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRzFck1Z5peOL7pYpuG7hUeyZUoycgCEU",
            authDomain: "hussein-salman.firebaseapp.com",
            projectId: "hussein-salman",
            storageBucket: "hussein-salman.firebasestorage.app",
            messagingSenderId: "862323992221",
            appId: "1:862323992221:web:009cfd696d6f4142e91674"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. جلب حساباتك الشخصية
        async function fetchSocialLinks() {
            const docSnap = await getDoc(doc(db, "settings", "social_links"));
            if (docSnap.exists()) {
                const data = docSnap.data();
                const container = document.getElementById('social-links-container');
                let html = '';
                
                // قالب الزر العام
                const btn = (link, icon, colorClass, title) => {
                    if(!link) return '';
                    return `<a href="${link}" target="_blank" class="w-10 h-10 rounded-full flex items-center justify-center border transition ${colorClass}" title="${title}"><i class="${icon} text-lg"></i></a>`;
                };

                html += btn(data.github, 'fa-brands fa-github', 'bg-slate-800 text-white border-slate-700 hover:bg-slate-700', 'GitHub');
                html += btn(data.playstore, 'fa-brands fa-google-play', 'bg-emerald-900/30 text-emerald-400 border-emerald-800 hover:bg-emerald-900/60', 'Google Play');
                html += btn(data.tgAccount, 'fa-brands fa-telegram', 'bg-blue-900/30 text-blue-400 border-blue-800 hover:bg-blue-900/60', 'حساب تلغرام');
                html += btn(data.tgChannel, 'fa-solid fa-bullhorn', 'bg-sky-900/30 text-sky-400 border-sky-800 hover:bg-sky-900/60', 'قناة تلغرام');
                html += btn(data.insta, 'fa-brands fa-instagram', 'bg-pink-900/30 text-pink-400 border-pink-800 hover:bg-pink-900/60', 'إنستغرام');
                html += btn(data.tiktok, 'fa-brands fa-tiktok', 'bg-slate-800 text-white border-slate-700 hover:bg-slate-700', 'تيك توك');
                html += btn(data.youtube, 'fa-brands fa-youtube', 'bg-red-900/30 text-red-400 border-red-800 hover:bg-red-900/60', 'يوتيوب');
                html += btn(data.email ? `mailto:${data.email}` : null, 'fa-solid fa-envelope', 'bg-yellow-900/30 text-yellow-400 border-yellow-800 hover:bg-yellow-900/60', 'إيميل');
                
                container.innerHTML = html;
            }
        }

        // 2. جلب الشهادات
        async function fetchCerts() {
            const container = document.getElementById('certs-container');
            const section = document.getElementById('certs-section');
            const q = query(collection(db, "portfolio_certs"), orderBy("createdAt", "desc"));
            const snaps = await getDocs(q);
            
            if (!snaps.empty) {
                section.classList.remove('hidden'); // إظهار القسم إذا كانت هناك شهادات
                snaps.forEach((docSnap) => {
                    const data = docSnap.data();
                    let card = `
                        <a href="${data.link}" target="_blank" class="cert-card bg-slate-900 border border-slate-800 rounded-lg p-4 flex items-center gap-4 transition duration-300 hover:border-yellow-600/50 shadow-sm">
                            <div class="w-12 h-12 rounded-full bg-yellow-900/20 flex items-center justify-center text-yellow-500 shrink-0">
                                <i class="fa-solid fa-certificate text-xl"></i>
                            </div>
                            <div class="overflow-hidden">
                                <h4 class="text-white font-bold text-sm truncate">${data.name}</h4>
                                <p class="text-slate-400 text-xs mt-1 truncate">${data.issuer}</p>
                            </div>
                        </a>
                    `;
                    container.innerHTML += card;
                });
            }
        }

        function getYoutubeEmbed(url) {
            if(!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : null;
        }

        // 3. جلب المحتوى الرئيسي
        async function fetchPosts() {
            const container = document.getElementById('posts-container');
            const q = query(collection(db, "portfolio_posts"), orderBy("createdAt", "desc"));
            const snaps = await getDocs(q);
            
            container.innerHTML = snaps.empty ? '<div class="col-span-full text-center text-slate-500 py-10">لا يوجد محتوى.</div>' : '';

            snaps.forEach((docSnap) => {
                const data = docSnap.data();
                
                let mediaHTML = '';
                if(data.type === 'video' && data.link) {
                    const embedUrl = getYoutubeEmbed(data.link);
                    if(embedUrl) {
                        mediaHTML = `<div class="aspect-video w-full rounded-t-xl overflow-hidden bg-black mb-4"><iframe src="${embedUrl}" class="w-full h-full" frameborder="0" allowfullscreen></iframe></div>`;
                    }
                }

                let badge = data.type === 'app' ? '<span class="bg-emerald-900/50 text-emerald-400 border border-emerald-800 text-xs px-2 py-1 rounded font-bold"><i class="fa-brands fa-android ml-1"></i> تطبيق</span>' : 
                            data.type === 'video' ? '<span class="bg-red-900/50 text-red-400 border border-red-800 text-xs px-2 py-1 rounded font-bold"><i class="fa-brands fa-youtube ml-1"></i> فيديو</span>' : 
                            '<span class="bg-indigo-900/50 text-indigo-400 border border-indigo-800 text-xs px-2 py-1 rounded font-bold"><i class="fa-solid fa-file-code ml-1"></i> مقال</span>';

                let card = `
                    <div class="post-card ${data.type} flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden hover:border-cyan-700 transition duration-300 shadow-sm" data-title="${data.title}">
                        ${mediaHTML}
                        <div class="p-6 flex flex-col flex-grow">
                            <div class="mb-3">${badge}</div>
                            <h3 class="font-bold text-xl text-white mb-2">${data.title}</h3>
                            <p class="text-slate-400 text-sm leading-relaxed line-clamp-3 mb-4">${data.description}</p>
                            <a href="article.html?id=${docSnap.id}" class="mt-auto block text-center bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-lg font-medium transition text-sm border border-slate-700">التفاصيل / فتح</a>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // الفلترة والبحث
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('bg-cyan-700', 'text-white');
                    b.classList.add('bg-slate-800', 'text-slate-300');
                });
                e.target.classList.remove('bg-slate-800', 'text-slate-300');
                e.target.classList.add('bg-cyan-700', 'text-white');

                const filter = e.target.getAttribute('data-filter');
                document.querySelectorAll('.post-card').forEach(card => {
                    if(filter === 'all' || card.classList.contains(filter)) card.classList.remove('hidden-card');
                    else card.classList.add('hidden-card');
                });
            });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.post-card').forEach(card => {
                const title = card.getAttribute('data-title').toLowerCase();
                if(title.includes(term)) card.classList.remove('hidden-card');
                else card.classList.add('hidden-card');
            });
        });

        // تشغيل كل الوظائف عند تحميل الصفحة
        fetchSocialLinks();
        fetchCerts();
        fetchPosts();
    </script>
</body>
</html>
